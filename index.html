<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232f6fed'/><path d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Job Tracker</h1>
  </header>

  <noscript>
    <p class="container">Job Tracker needs JavaScript turned on to work.</p>
  </noscript>

  <main class="container">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add a job</h2>
      <form id="job-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="company">Company <span class="req" aria-hidden="true">*</span></label>
            <input id="company" name="company" type="text" autocomplete="organization" required>
            <p class="error" data-error-for="company"></p>
          </div>

          <div class="field">
            <label for="role">Role <span class="req" aria-hidden="true">*</span></label>
            <input id="role" name="role" type="text" required>
            <p class="error" data-error-for="role"></p>
          </div>

          <div class="field">
            <label for="link">Link</label>
            <input id="link" name="link" type="url" placeholder="https://…" inputmode="url">
            <p class="error" data-error-for="link"></p>
          </div>

          <div class="field">
            <label for="dateApplied">Date applied</label>
            <input id="dateApplied" name="dateApplied" type="date">
            <p class="error" data-error-for="dateApplied"></p>
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status"></select>
            <p class="error" data-error-for="status"></p>
          </div>

          <div class="field field-full">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add job</button>
          <button type="button" id="cancel-btn" class="btn" hidden>Cancel</button>
        </div>
        <p id="form-message" class="form-message" role="status"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Applications</h2>

      <ul id="summary" class="summary" aria-label="Applications by status"></ul>

      <div class="toolbar">
        <div class="field">
          <label for="search">Search</label>
          <input id="search" type="search" placeholder="Company, role, or notes">
        </div>
        <div class="field">
          <label for="filter-status">Status</label>
          <select id="filter-status"></select>
        </div>
        <div class="field">
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="dateApplied:desc">Newest first</option>
            <option value="dateApplied:asc">Oldest first</option>
            <option value="company:asc">Company A–Z</option>
            <option value="company:desc">Company Z–A</option>
          </select>
        </div>
      </div>

      <p id="result-count" class="result-count" role="status"></p>
      <ul id="job-list" class="job-list"></ul>
      <p id="empty-state" class="empty-state" hidden>No jobs yet. Add your first application above.</p>
    </section>

    <section class="panel" aria-labelledby="backup-title">
      <h2 id="backup-title">Backup</h2>
      <p class="hint">Your jobs are saved only in this browser. Export a backup file to keep a copy or move your list to another browser.</p>
      <div class="form-actions">
        <button type="button" id="export-btn" class="btn">Export JSON</button>
        <button type="button" id="import-btn" class="btn">Import JSON</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
      <p id="backup-message" class="form-message" role="status"></p>
    </section>
  </main>

  <dialog id="import-dialog" class="dialog" aria-labelledby="import-dialog-title">
    <form method="dialog">
      <h2 id="import-dialog-title">Import backup</h2>
      <p id="import-summary"></p>
      <p id="import-warning" class="dialog-warning"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn" autofocus>Cancel</button>
        <button type="submit" value="replace" id="import-replace" class="btn btn-danger">Replace all</button>
        <button type="submit" value="merge" id="import-merge" class="btn btn-primary">Merge</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
